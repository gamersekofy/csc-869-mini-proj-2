[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csc869-mp2"
version = "1.0.0"
description = "CSC 869 Mini Project 2 -- Python implementation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "matplotlib-venn>=1.1",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["csc869*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
